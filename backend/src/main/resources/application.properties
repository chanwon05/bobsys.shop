spring.application.name=bobsys

# MySQL database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bobsys_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${BOBSYS_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.address=127.0.0.1
spring.jpa.open-in-view=false

# Product image uploads (relative to the backend working directory)
app.upload-directory=uploads/products
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Optional stable JWT signing key (Base64, at least 32 random bytes).
# If unset, restarting the server invalidates existing login tokens.
app.jwt.secret=${APP_JWT_SECRET:}
